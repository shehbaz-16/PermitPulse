# Refreshes permit data every morning on the hosted site (free with GitHub Actions).
# Repo → Settings → Secrets and variables → Actions: add APP_URL (e.g. https://permitpulse-ontario.onrender.com)
# and TEAM_PASSWORD (same value as on the host).
name: Daily permit sync
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 5-6 a.m. Toronto
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site (free hosts sleep when idle)
        run: curl -fsS --retry 5 --retry-delay 15 "$APP_URL/api/health"
        env:
          APP_URL: ${{ secrets.APP_URL }}
      - name: Sync all live cities
        run: curl -fsS -X POST -u "team:$TEAM_PASSWORD" "$APP_URL/api/sync/all" --max-time 300
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
